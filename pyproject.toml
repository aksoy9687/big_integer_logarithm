[project]
name = "big-integer-logarithm"
version = "0.1.1"
description = "Returns the integer floor of the base-b logarithm of an arbitrarily large integer using bit-length scaling and correction."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
